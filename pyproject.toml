[project]
name = "verl-code-rl"
version = "0.1.0"
description = "Clean verl + vLLM GRPO harness for HumanEval/MBPP code RL."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "torch>=2.0",
  "transformers>=4.45",
  "peft>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
